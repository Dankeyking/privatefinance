name: Build and publish Docker image

on:
  push:
    branches: [main, redesign-v2]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Nur main darf :latest bewegen. Jeder andere Branch bekommt ein eigenes
      # Tag, damit eine Vorschau-Instanz daneben laufen kann, ohne die
      # Produktion zu überschreiben.
      - name: Tags bestimmen
        run: |
          PREFIX="${{ env.REGISTRY }}/${IMAGE_NAME_LC}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAGS=${PREFIX}:latest,${PREFIX}:${{ github.sha }}" >> "$GITHUB_ENV"
          else
            SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            echo "TAGS=${PREFIX}:${SLUG}" >> "$GITHUB_ENV"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
